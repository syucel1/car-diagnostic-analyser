<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
  </defs>
  <rect width="960" height="470" fill="#fff"/>
  <!-- UI layer -->
  <rect x="20" y="16" width="920" height="80" rx="10" fill="#eef0fb" stroke="#7b83d1"/>
  <text x="36" y="40" font-size="14" font-weight="700" fill="#2b3170">UI  (React)</text>
  <g font-size="12" fill="#1f2d3a">
    <rect x="36" y="52" width="130" height="32" rx="6" fill="#fff" stroke="#b9bde8"/><text x="101" y="72" text-anchor="middle">Connect</text>
    <rect x="178" y="52" width="130" height="32" rx="6" fill="#fff" stroke="#b9bde8"/><text x="243" y="72" text-anchor="middle">Scan + car diagram</text>
    <rect x="320" y="52" width="130" height="32" rx="6" fill="#fff" stroke="#b9bde8"/><text x="385" y="72" text-anchor="middle">Report</text>
    <rect x="462" y="52" width="130" height="32" rx="6" fill="#fff" stroke="#b9bde8"/><text x="527" y="72" text-anchor="middle">Live gauges</text>
    <rect x="604" y="52" width="130" height="32" rx="6" fill="#fff" stroke="#b9bde8"/><text x="669" y="72" text-anchor="middle">History / compare</text>
    <rect x="746" y="52" width="180" height="32" rx="6" fill="#fff" stroke="#b9bde8"/><text x="836" y="72" text-anchor="middle">Maintenance + inspection log</text>
  </g>
  <line x1="480" y1="96" x2="480" y2="122" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <!-- Scan engine -->
  <rect x="20" y="124" width="620" height="92" rx="10" fill="#eaf6ec" stroke="#5aa86a"/>
  <text x="36" y="148" font-size="14" font-weight="700" fill="#24502e">Scan engine</text>
  <g font-size="12" fill="#1f2d3a">
    <rect x="36" y="160" width="140" height="44" rx="6" fill="#fff" stroke="#a8d4b1"/><text x="106" y="179" text-anchor="middle">Discovery</text><text x="106" y="195" text-anchor="middle" font-size="10" fill="#4a5b6b">protocol, VIN, PIDs</text>
    <rect x="186" y="160" width="140" height="44" rx="6" fill="#fff" stroke="#a8d4b1"/><text x="256" y="179" text-anchor="middle">Planner</text><text x="256" y="195" text-anchor="middle" font-size="10" fill="#4a5b6b">checks from profiles</text>
    <rect x="336" y="160" width="140" height="44" rx="6" fill="#fff" stroke="#a8d4b1"/><text x="406" y="179" text-anchor="middle">Runner</text><text x="406" y="195" text-anchor="middle" font-size="10" fill="#4a5b6b">queue, timeouts, retry</text>
    <rect x="486" y="160" width="140" height="44" rx="6" fill="#fff" stroke="#a8d4b1"/><text x="556" y="179" text-anchor="middle">Event bus</text><text x="556" y="195" text-anchor="middle" font-size="10" fill="#4a5b6b">progress → UI</text>
  </g>
  <!-- Profiles -->
  <rect x="660" y="124" width="280" height="92" rx="10" fill="#fff6e5" stroke="#d9a441"/>
  <text x="676" y="148" font-size="14" font-weight="700" fill="#6b5320">Vehicle profiles (data)</text>
  <text x="676" y="170" font-size="12" fill="#1f2d3a">generic-obd2.json  (all cars)</text>
  <text x="676" y="188" font-size="12" fill="#1f2d3a">make-model-year.json  (ABS, TPMS,</text>
  <text x="676" y="204" font-size="12" fill="#1f2d3a">oil life … per car, added later)</text>
  <line x1="660" y1="170" x2="642" y2="170" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="330" y1="216" x2="330" y2="242" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <!-- Protocol + guard -->
  <rect x="20" y="244" width="920" height="84" rx="10" fill="#fdecec" stroke="#d66"/>
  <text x="36" y="268" font-size="14" font-weight="700" fill="#7a1f1f">Read-only guard  —  every request passes the allowlist or is refused</text>
  <g font-size="12" fill="#1f2d3a">
    <rect x="36" y="280" width="200" height="36" rx="6" fill="#fff" stroke="#e7a3a3"/><text x="136" y="302" text-anchor="middle">OBD-II service codec (01–0A)</text>
    <rect x="248" y="280" width="200" height="36" rx="6" fill="#fff" stroke="#e7a3a3"/><text x="348" y="302" text-anchor="middle">UDS read codec (19, 22)</text>
    <rect x="460" y="280" width="200" height="36" rx="6" fill="#fff" stroke="#e7a3a3"/><text x="560" y="302" text-anchor="middle">DTC + PID decoders</text>
    <rect x="672" y="280" width="252" height="36" rx="6" fill="#fff" stroke="#e7a3a3"/><text x="798" y="302" text-anchor="middle">Allowlist: blocks 04, 08, 14, 2E, 31 …</text>
  </g>
  <line x1="480" y1="328" x2="480" y2="354" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <!-- Transport -->
  <rect x="20" y="356" width="920" height="96" rx="10" fill="#f1f3f5" stroke="#9aa5b1"/>
  <text x="36" y="380" font-size="14" font-weight="700" fill="#2d3640">Transport  (one interface: send(cmd) → lines)</text>
  <g font-size="12" fill="#1f2d3a">
    <rect x="36" y="392" width="280" height="46" rx="6" fill="#fff" stroke="#c3cad2"/><text x="176" y="412" text-anchor="middle" font-weight="600">ElmSerialTransport</text><text x="176" y="428" text-anchor="middle" font-size="10" fill="#4a5b6b">Web Serial · AT init · "&gt;" prompt framing</text>
    <rect x="336" y="392" width="280" height="46" rx="6" fill="#fff" stroke="#c3cad2"/><text x="476" y="412" text-anchor="middle" font-weight="600">SimulatorTransport</text><text x="476" y="428" text-anchor="middle" font-size="10" fill="#4a5b6b">demo car + test fixtures, scripted faults</text>
    <rect x="636" y="392" width="288" height="46" rx="6" fill="#fff" stroke="#c3cad2" stroke-dasharray="4 3"/><text x="780" y="412" text-anchor="middle" font-weight="600">ReplayTransport (later)</text><text x="780" y="428" text-anchor="middle" font-size="10" fill="#4a5b6b">plays back a recorded real session</text>
  </g>
</svg>
