<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="420" rx="10" fill="#0f1419"/>
  <rect width="960" height="48" rx="10" fill="#151c23"/><rect y="38" width="960" height="10" fill="#151c23"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#e6edf3">car-diagnostic-analyser</text>
  <text x="940" y="30" font-size="11" fill="#8b98a5" text-anchor="end">History · Maintenance · Settings</text>

  <!-- real car card -->
  <rect x="40" y="76" width="430" height="300" rx="14" fill="#151c23" stroke="#2f6b3e"/>
  <text x="64" y="112" font-size="18" font-weight="700" fill="#e6edf3">Scan my car</text>
  <text x="64" y="136" font-size="12" fill="#8b98a5">USB OBD-II adapter · Chrome or Edge on desktop</text>
  <g font-size="12" fill="#c4ccd4">
    <circle cx="74" cy="170" r="10" fill="#12261a" stroke="#3fb950"/><text x="74" y="174" text-anchor="middle" font-size="11" fill="#7ee08f">✓</text><text x="94" y="174">Park, handbrake on, ignition on (engine off or idling)</text>
    <circle cx="74" cy="200" r="10" fill="#12261a" stroke="#3fb950"/><text x="74" y="204" text-anchor="middle" font-size="11" fill="#7ee08f">✓</text><text x="94" y="204">Plug the adapter into the socket under the dash</text>
    <circle cx="74" cy="230" r="10" fill="#1d2630" stroke="#3a4552"/><text x="74" y="234" text-anchor="middle" font-size="11" fill="#8b98a5">3</text><text x="94" y="234">Connect USB, then pick its COM port</text>
  </g>
  <rect x="64" y="262" width="382" height="40" rx="8" fill="#238636"/>
  <text x="255" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Choose adapter…</text>
  <text x="64" y="330" font-size="11" fill="#8b98a5">Read-only: this app cannot clear codes, run tests or change settings.</text>
  <text x="64" y="350" font-size="11" fill="#8b98a5">Last used: OBDLink EX on COM4 · 2008 VW Golf</text>

  <!-- demo card -->
  <rect x="490" y="76" width="430" height="300" rx="14" fill="#151c23" stroke="#24303b"/>
  <text x="514" y="112" font-size="18" font-weight="700" fill="#e6edf3">Try the demo car</text>
  <text x="514" y="136" font-size="12" fill="#8b98a5">No hardware needed · simulated ECU replies</text>
  <g font-size="12" fill="#c4ccd4">
    <text x="514" y="174">Scenario</text>
    <rect x="514" y="184" width="382" height="34" rx="6" fill="#1d2630" stroke="#3a4552"/>
    <text x="528" y="206">Lean engine + low front-right tyre + brake check due  ▾</text>
    <text x="514" y="244" fill="#8b98a5" font-size="11">Also: healthy car · old K-line car · ABS module offline · flaky adapter</text>
  </g>
  <rect x="514" y="262" width="382" height="40" rx="8" fill="#1f6feb"/>
  <text x="705" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Run demo scan</text>
  <text x="514" y="330" font-size="11" fill="#8b98a5">Uses exactly the same scan engine; only the transport is simulated.</text>
</svg>
