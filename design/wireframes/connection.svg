<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
  </defs>
  <rect width="960" height="220" fill="#ffffff"/>
  <!-- car -->
  <g transform="translate(20,40)">
    <rect width="190" height="120" rx="14" fill="#eef3f8" stroke="#9fb3c8"/>
    <text x="95" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2d3a">Car</text>
    <text x="95" y="54" text-anchor="middle" font-size="12" fill="#4a5b6b">Engine ECU · ABS · TCM</text>
    <text x="95" y="72" text-anchor="middle" font-size="12" fill="#4a5b6b">BCM · SRS · TPMS …</text>
    <rect x="45" y="86" width="100" height="24" rx="5" fill="#fff" stroke="#9fb3c8"/>
    <text x="95" y="103" text-anchor="middle" font-size="11" fill="#1f2d3a">CAN bus / K-line</text>
  </g>
  <line x1="210" y1="100" x2="268" y2="100" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <!-- socket -->
  <g transform="translate(270,55)">
    <rect width="150" height="90" rx="12" fill="#fff6e5" stroke="#d9a441"/>
    <text x="75" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2d3a">OBD-II socket</text>
    <text x="75" y="52" text-anchor="middle" font-size="12" fill="#6b5320">16-pin J1962</text>
    <text x="75" y="70" text-anchor="middle" font-size="12" fill="#6b5320">under dashboard</text>
  </g>
  <line x1="420" y1="100" x2="478" y2="100" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <!-- adapter -->
  <g transform="translate(480,55)">
    <rect width="160" height="90" rx="12" fill="#eaf6ec" stroke="#5aa86a"/>
    <text x="80" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2d3a">USB OBD adapter</text>
    <text x="80" y="52" text-anchor="middle" font-size="12" fill="#2f5e39">ELM327 / STN chip</text>
    <text x="80" y="70" text-anchor="middle" font-size="12" fill="#2f5e39">virtual COM port</text>
  </g>
  <line x1="640" y1="100" x2="698" y2="100" stroke="#5b6b7a" stroke-width="2" marker-end="url(#a)"/>
  <!-- laptop -->
  <g transform="translate(700,40)">
    <rect width="240" height="120" rx="14" fill="#eef0fb" stroke="#7b83d1"/>
    <text x="120" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2d3a">Laptop · Chrome / Edge</text>
    <text x="120" y="54" text-anchor="middle" font-size="12" fill="#3d447f">Web Serial API</text>
    <rect x="30" y="68" width="180" height="36" rx="7" fill="#fff" stroke="#7b83d1"/>
    <text x="120" y="91" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2d3a">car-diagnostic-analyser</text>
  </g>
  <text x="480" y="200" text-anchor="middle" font-size="12" fill="#5b6b7a">Text commands go out (e.g. "03" = read stored fault codes); hex replies come back. Nothing is installed in the car.</text>
</svg>
