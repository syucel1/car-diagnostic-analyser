  <rect x="32" y="436" width="528" height="132" rx="8" fill="#1d2630"/>
  <text x="46" y="460" font-size="12" font-weight="600" fill="#e6edf3">How status is worked out</text>
  <g font-size="11" fill="#c4ccd4">
    <text x="46" y="482">• Intervals come from your owner's manual — the app ships no defaults it can't vouch for.</text>
    <text x="46" y="502">• DUE when distance or time is exceeded, whichever comes first; SOON within 10 %.</text>
    <text x="46" y="522">• Due and unknown items appear in every scan report as Manual inspection rows.</text>
    <text x="46" y="542">• Where a profile can read the car's own service counter (phase 16), it's shown</text>
    <text x="58" y="558">alongside your log, labelled “from car”.</text>
  </g>

