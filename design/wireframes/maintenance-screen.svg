    <rect x="400" y="390" width="90" height="8" rx="4" fill="#24303b" stroke="#a371f7" stroke-dasharray="3 2"/><text x="400" y="412" fill="#c9a6ff" font-size="10">set interval &amp; last done</text>
    <rect x="496" y="386" width="64" height="18" rx="9" fill="#211736"/><text x="528" y="399" text-anchor="middle" font-size="10" fill="#c9a6ff">UNKNOWN</text>
