<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="600" rx="10" fill="#0f1419"/>
  <rect width="960" height="48" rx="10" fill="#151c23"/><rect y="38" width="960" height="10" fill="#151c23"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#e6edf3">car-diagnostic-analyser</text>
  <text x="250" y="30" font-size="12" fill="#8b98a5">Report · 2008 VW Golf 1.6 · 8 Nov 2026 13:52 · 41 checks · 1m 22s</text>
  <rect x="770" y="12" width="82" height="26" rx="6" fill="#1d2630" stroke="#3a4552"/><text x="811" y="29" text-anchor="middle" font-size="12" fill="#e6edf3">Export PDF</text>
  <rect x="860" y="12" width="84" height="26" rx="6" fill="#1d2630" stroke="#3a4552"/><text x="902" y="29" text-anchor="middle" font-size="12" fill="#e6edf3">Compare…</text>

  <!-- summary tiles -->
  <g font-size="11">
    <rect x="16" y="62" width="220" height="92" rx="10" fill="#2b2210" stroke="#5c4716"/>
    <text x="32" y="86" fill="#e3b341">NEEDS ATTENTION</text><text x="32" y="120" font-size="26" font-weight="700" fill="#ffd57a">2 faults</text><text x="32" y="140" fill="#c9ad6a">engine · tyre warning</text>
    <rect x="248" y="62" width="220" height="92" rx="10" fill="#151c23" stroke="#24303b"/>
    <text x="264" y="86" fill="#8b98a5">COVERAGE</text><text x="264" y="120" font-size="26" font-weight="700" fill="#e6edf3">36 / 41</text><text x="264" y="140" fill="#8b98a5">answered · 4 unsupported · 1 no reply</text>
    <rect x="480" y="62" width="220" height="92" rx="10" fill="#151c23" stroke="#24303b"/>
    <text x="496" y="86" fill="#8b98a5">MOT READINESS (EMISSIONS)</text><text x="496" y="120" font-size="26" font-weight="700" fill="#e6edf3">6 / 7</text><text x="496" y="140" fill="#8b98a5">catalyst monitor incomplete</text>
    <rect x="712" y="62" width="232" height="92" rx="10" fill="#211736" stroke="#3f2c66"/>
    <text x="728" y="86" fill="#c9a6ff">MANUAL INSPECTION</text><text x="728" y="120" font-size="26" font-weight="700" fill="#e2d1ff">4 to do</text><text x="728" y="140" fill="#a58bd0">tyres · pads · oil level · wipers</text>
  </g>

  <!-- fault detail -->
  <rect x="16" y="166" width="560" height="250" rx="10" fill="#151c23" stroke="#24303b"/>
  <text x="32" y="192" font-size="13" font-weight="700" fill="#e6edf3">Engine · P0171</text>
  <rect x="140" y="178" width="58" height="20" rx="10" fill="#2b2210"/><text x="169" y="192" font-size="10" text-anchor="middle" fill="#e3b341">STORED</text>
  <text x="32" y="216" font-size="12" fill="#c4ccd4">System too lean (bank 1). The engine computer is adding fuel to compensate</text>
  <text x="32" y="232" font-size="12" fill="#c4ccd4">for extra air or too little fuel — common causes: vacuum leak, MAF sensor, fuel pressure.</text>
  <text x="32" y="262" font-size="11" fill="#8b98a5">FREEZE FRAME (when the code was set)</text>
  <g font-size="12">
    <text x="32" y="286" fill="#8b98a5">Engine speed</text><text x="200" y="286" fill="#e6edf3">2,140 rpm</text>
    <text x="300" y="286" fill="#8b98a5">Coolant</text><text x="440" y="286" fill="#e6edf3">91 °C</text>
    <text x="32" y="308" fill="#8b98a5">Vehicle speed</text><text x="200" y="308" fill="#e6edf3">64 km/h</text>
    <text x="300" y="308" fill="#8b98a5">Load</text><text x="440" y="308" fill="#e6edf3">38 %</text>
    <text x="32" y="330" fill="#8b98a5">Short-term trim B1</text><text x="200" y="330" fill="#e6edf3">+9.4 %</text>
    <text x="300" y="330" fill="#8b98a5">Long-term trim B1</text><text x="440" y="330" fill="#e3b341">+17.2 %</text>
    <text x="32" y="352" fill="#8b98a5">Fuel system</text><text x="200" y="352" fill="#e6edf3">closed loop</text>
    <text x="300" y="352" fill="#8b98a5">Distance with MIL on</text><text x="440" y="352" fill="#e6edf3">212 km</text>
  </g>
  <rect x="32" y="372" width="528" height="30" rx="6" fill="#1d2630"/>
  <text x="44" y="391" font-size="11" fill="#8b98a5">ⓘ This app never clears codes. Fix the cause first; clearing also erases this freeze frame.</text>

  <!-- tyres -->
  <rect x="588" y="166" width="356" height="250" rx="10" fill="#151c23" stroke="#24303b"/>
  <text x="604" y="192" font-size="13" font-weight="700" fill="#e6edf3">Tyres</text>
  <text x="928" y="192" font-size="11" fill="#8b98a5" text-anchor="end">source: TPMS warning + your gauge</text>
  <rect x="716" y="212" width="100" height="180" rx="30" fill="#1a232d" stroke="#3a4552"/>
  <g font-size="12">
    <rect x="618" y="222" width="88" height="56" rx="8" fill="#12261a" stroke="#2f6b3e"/><text x="662" y="244" text-anchor="middle" fill="#7ee08f">FL</text><text x="662" y="266" text-anchor="middle" font-weight="700" fill="#e6edf3">2.3 bar</text>
    <rect x="826" y="222" width="88" height="56" rx="8" fill="#2b2210" stroke="#5c4716"/><text x="870" y="244" text-anchor="middle" fill="#e3b341">FR</text><text x="870" y="266" text-anchor="middle" font-weight="700" fill="#ffd57a">1.8 bar</text>
    <rect x="618" y="326" width="88" height="56" rx="8" fill="#12261a" stroke="#2f6b3e"/><text x="662" y="348" text-anchor="middle" fill="#7ee08f">RL</text><text x="662" y="370" text-anchor="middle" font-weight="700" fill="#e6edf3">2.2 bar</text>
    <rect x="826" y="326" width="88" height="56" rx="8" fill="#211736" stroke="#3f2c66"/><text x="870" y="348" text-anchor="middle" fill="#c9a6ff">RR</text><text x="870" y="370" text-anchor="middle" fill="#c9a6ff">enter…</text>
  </g>
  <text x="604" y="406" font-size="10" fill="#8b98a5">Recommended 2.2 bar (from door sticker, entered once)</text>

  <!-- systems table -->
  <rect x="16" y="428" width="928" height="156" rx="10" fill="#151c23" stroke="#24303b"/>
  <g font-size="12">
    <text x="32" y="452" font-size="11" fill="#8b98a5">SYSTEM</text><text x="200" y="452" font-size="11" fill="#8b98a5">STATUS</text><text x="420" y="452" font-size="11" fill="#8b98a5">DETAIL</text><text x="928" y="452" font-size="11" fill="#8b98a5" text-anchor="end">SOURCE</text>
    <line x1="32" y1="460" x2="928" y2="460" stroke="#24303b"/>
    <text x="32" y="482" fill="#e6edf3">Engine</text><text x="200" y="482" fill="#e3b341">⚠ Fault reported</text><text x="420" y="482" fill="#c4ccd4">P0171 · MIL on · LTFT +14 %</text><text x="928" y="482" fill="#8b98a5" text-anchor="end">OBD-II generic</text>
    <text x="32" y="506" fill="#e6edf3">Emissions</text><text x="200" y="506" fill="#7ee08f">✓ Reading received</text><text x="420" y="506" fill="#c4ccd4">6/7 monitors ready · catalyst incomplete</text><text x="928" y="506" fill="#8b98a5" text-anchor="end">OBD-II generic</text>
    <text x="32" y="530" fill="#e6edf3">ABS</text><text x="200" y="530" fill="#ff9b95">✕ No response</text><text x="420" y="530" fill="#c4ccd4">ABS unavailable — not the same as “no faults”</text><text x="928" y="530" fill="#8b98a5" text-anchor="end">profile: VW Golf Mk5</text>
    <text x="32" y="554" fill="#e6edf3">Brakes</text><text x="200" y="554" fill="#c9a6ff">◆ Manual inspection</text><text x="420" y="554" fill="#c4ccd4">Front pads 7 mm (logged 2 Nov) · fluid due Mar 2027</text><text x="928" y="554" fill="#8b98a5" text-anchor="end">your log</text>
    <text x="32" y="578" fill="#e6edf3">Oil &amp; filters</text><text x="200" y="578" fill="#7ee08f">✓ Within interval</text><text x="420" y="578" fill="#c4ccd4">Oil + filter 4,100 km ago · air filter due in 9,000 km</text><text x="928" y="578" fill="#8b98a5" text-anchor="end">your log</text>
  </g>
</svg>
