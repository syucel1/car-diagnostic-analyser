<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="600" rx="10" fill="#0f1419"/>
  <!-- top bar -->
  <rect width="960" height="48" rx="10" fill="#151c23"/>
  <rect y="38" width="960" height="10" fill="#151c23"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#e6edf3">car-diagnostic-analyser</text>
  <rect x="236" y="13" width="390" height="24" rx="12" fill="#12261a" stroke="#2f6b3e"/>
  <circle cx="252" cy="25" r="5" fill="#3fb950"/>
  <text x="264" y="29" font-size="11" fill="#b7e4c1">OBDLink EX · COM4 · ISO 15765-4 CAN 11-bit 500k · 12.6 V</text>
  <text x="640" y="29" font-size="11" fill="#8b98a5">VIN WVWZZZ1KZ8W••••••</text>
  <rect x="858" y="12" width="86" height="26" rx="6" fill="#2a1416" stroke="#6e2a2e"/>
  <text x="901" y="29" text-anchor="middle" font-size="12" fill="#ff9b95">Stop scan</text>

  <!-- left: car diagram -->
  <rect x="16" y="62" width="360" height="522" rx="10" fill="#151c23" stroke="#24303b"/>
  <text x="32" y="86" font-size="12" fill="#8b98a5">FRONT</text>
  <g transform="translate(96,100)">
    <!-- wheels -->
    <rect x="-18" y="40" width="26" height="70" rx="6" fill="#1d2630" stroke="#3fb950" stroke-width="2"/>
    <rect x="192" y="40" width="26" height="70" rx="6" fill="#1d2630" stroke="#d29922" stroke-width="2"/>
    <rect x="-18" y="320" width="26" height="70" rx="6" fill="#1d2630" stroke="#3a4552" stroke-width="2"/>
    <rect x="192" y="320" width="26" height="70" rx="6" fill="#1d2630" stroke="#3a4552" stroke-width="2"/>
    <!-- body -->
    <rect x="0" y="0" width="200" height="440" rx="60" fill="#1a232d" stroke="#3a4552" stroke-width="2"/>
    <!-- engine zone scanning -->
    <rect x="24" y="22" width="152" height="112" rx="34" fill="#13314f" stroke="#58a6ff" stroke-width="2.5"/>
    <rect x="24" y="22" width="152" height="112" rx="34" fill="none" stroke="#58a6ff" stroke-width="8" opacity="0.18"/>
    <text x="100" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#cfe5ff">Engine</text>
    <text x="100" y="88" text-anchor="middle" font-size="11" fill="#8fc1ff">querying 01 05 …</text>
    <!-- windscreen -->
    <path d="M30,150 Q100,132 170,150 L160,176 Q100,164 40,176 Z" fill="#202b36"/>
    <!-- cabin: airbag -->
    <rect x="34" y="190" width="132" height="70" rx="12" fill="#1d2630" stroke="#3a4552" stroke-dasharray="4 3"/>
    <text x="100" y="222" text-anchor="middle" font-size="11" fill="#6e7681">Airbags (SRS)</text>
    <text x="100" y="238" text-anchor="middle" font-size="10" fill="#6e7681">not in generic scan</text>
    <!-- transmission -->
    <rect x="70" y="270" width="60" height="40" rx="8" fill="#1d2630" stroke="#3a4552"/>
    <text x="100" y="294" text-anchor="middle" font-size="10" fill="#8b98a5">Gearbox</text>
    <!-- rear -->
    <rect x="34" y="330" width="132" height="80" rx="30" fill="#1d2630" stroke="#3a4552"/>
    <text x="100" y="368" text-anchor="middle" font-size="11" fill="#8b98a5">Emissions / EVAP</text>
    <text x="100" y="384" text-anchor="middle" font-size="10" fill="#6e7681">pending</text>
    <!-- battery -->
    <rect x="148" y="34" width="22" height="16" rx="3" fill="#12261a" stroke="#3fb950"/>
  </g>
  <!-- wheel labels -->
  <text x="78" y="226" font-size="10" fill="#7ee08f">FL tyre ✓</text>
  <text x="314" y="226" font-size="10" fill="#e3b341" text-anchor="end">FR tyre ⚠ low</text>
  <g font-size="11">
    <circle cx="36" cy="560" r="5" fill="#58a6ff"/><text x="46" y="564" fill="#8b98a5">scanning</text>
    <circle cx="118" cy="560" r="5" fill="#3fb950"/><text x="128" y="564" fill="#8b98a5">ok</text>
    <circle cx="164" cy="560" r="5" fill="#d29922"/><text x="174" y="564" fill="#8b98a5">fault</text>
    <circle cx="220" cy="560" r="5" fill="#a371f7"/><text x="230" y="564" fill="#8b98a5">manual</text>
    <circle cx="290" cy="560" r="5" fill="#3a4552"/><text x="300" y="564" fill="#8b98a5">pending</text>
  </g>

  <!-- right: progress -->
  <rect x="392" y="62" width="552" height="138" rx="10" fill="#151c23" stroke="#24303b"/>
  <text x="408" y="90" font-size="18" font-weight="700" fill="#e6edf3">Scanning · 23 of 41 checks</text>
  <text x="928" y="90" font-size="12" fill="#8b98a5" text-anchor="end">00:47 elapsed · ~0:35 left</text>
  <!-- segmented bar -->
  <rect x="408" y="104" width="520" height="12" rx="6" fill="#24303b"/>
  <rect x="408" y="104" width="216" height="12" rx="6" fill="#3fb950"/>
  <rect x="620" y="104" width="25" height="12" fill="#d29922"/>
  <rect x="645" y="104" width="38" height="12" fill="#6e7681"/>
  <rect x="683" y="104" width="12" height="12" fill="#f85149"/>
  <rect x="695" y="104" width="10" height="12" fill="#58a6ff"/>
  <g font-size="11">
    <rect x="408" y="128" width="112" height="24" rx="12" fill="#12261a"/><text x="464" y="144" text-anchor="middle" fill="#7ee08f">17 reading received</text>
    <rect x="526" y="128" width="84" height="24" rx="12" fill="#2b2210"/><text x="568" y="144" text-anchor="middle" fill="#e3b341">2 fault reported</text>
    <rect x="616" y="128" width="88" height="24" rx="12" fill="#1f242a"/><text x="660" y="144" text-anchor="middle" fill="#8b98a5">3 unsupported</text>
    <rect x="710" y="128" width="88" height="24" rx="12" fill="#2a1416"/><text x="754" y="144" text-anchor="middle" fill="#ff9b95">1 no response</text>
    <rect x="804" y="128" width="124" height="24" rx="12" fill="#211736"/><text x="866" y="144" text-anchor="middle" fill="#c9a6ff">4 manual inspection</text>
  </g>
  <text x="408" y="182" font-size="12" fill="#58a6ff">→ Engine ECU (7E8) · 01 05 Coolant temperature · waiting 180 ms</text>

  <!-- check list -->
  <rect x="392" y="212" width="552" height="250" rx="10" fill="#151c23" stroke="#24303b"/>
  <g font-size="12">
    <text x="408" y="236" fill="#8b98a5" font-size="11">SYSTEM</text><text x="540" y="236" fill="#8b98a5" font-size="11">CHECK</text><text x="928" y="236" fill="#8b98a5" font-size="11" text-anchor="end">RESULT</text>
    <line x1="408" y1="244" x2="928" y2="244" stroke="#24303b"/>
    <text x="408" y="266" fill="#e6edf3">Engine</text><text x="540" y="266" fill="#c4ccd4">Stored fault codes (03)</text><text x="928" y="266" fill="#e3b341" text-anchor="end">⚠ P0171 System too lean B1</text>
    <text x="408" y="292" fill="#e6edf3">Engine</text><text x="540" y="292" fill="#c4ccd4">Pending fault codes (07)</text><text x="928" y="292" fill="#7ee08f" text-anchor="end">✓ none</text>
    <text x="408" y="318" fill="#e6edf3">Engine</text><text x="540" y="318" fill="#c4ccd4">Check-engine light (01 01)</text><text x="928" y="318" fill="#e3b341" text-anchor="end">⚠ ON · 1 code</text>
    <text x="408" y="344" fill="#e6edf3">Emissions</text><text x="540" y="344" fill="#c4ccd4">Readiness monitors (01 01)</text><text x="928" y="344" fill="#7ee08f" text-anchor="end">✓ 6 of 7 complete</text>
    <text x="408" y="370" fill="#e6edf3">Engine</text><text x="540" y="370" fill="#c4ccd4">Oil temperature (01 5C)</text><text x="928" y="370" fill="#8b98a5" text-anchor="end">— unsupported</text>
    <text x="408" y="396" fill="#e6edf3">ABS</text><text x="540" y="396" fill="#c4ccd4">Module fault codes (UDS 19 02)</text><text x="928" y="396" fill="#ff9b95" text-anchor="end">✕ no response (timeout 2 s)</text>
    <text x="408" y="422" fill="#e6edf3">Brakes</text><text x="540" y="422" fill="#c4ccd4">Pad thickness</text><text x="928" y="422" fill="#c9a6ff" text-anchor="end">◆ manual inspection</text>
    <text x="408" y="448" fill="#e6edf3">Engine</text><text x="540" y="448" fill="#c4ccd4">Coolant temperature (01 05)</text><text x="928" y="448" fill="#58a6ff" text-anchor="end">● querying…</text>
  </g>

  <!-- live strip -->
  <rect x="392" y="474" width="552" height="110" rx="10" fill="#151c23" stroke="#24303b"/>
  <g>
    <text x="408" y="498" font-size="11" fill="#8b98a5">RPM</text><text x="408" y="528" font-size="24" font-weight="700" fill="#e6edf3">812</text>
    <polyline points="408,566 420,560 432,563 444,558 456,562 468,559 480,561 492,557 504,560" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <text x="548" y="498" font-size="11" fill="#8b98a5">COOLANT</text><text x="548" y="528" font-size="24" font-weight="700" fill="#e6edf3">88 °C</text>
    <polyline points="548,570 560,568 572,566 584,564 596,563 608,562 620,561 632,561 644,560" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="688" y="498" font-size="11" fill="#8b98a5">BATTERY</text><text x="688" y="528" font-size="24" font-weight="700" fill="#e6edf3">14.1 V</text>
    <polyline points="688,562 700,562 712,561 724,562 736,561 748,562 760,561 772,562 784,561" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="808" y="498" font-size="11" fill="#8b98a5">FUEL TRIM LT B1</text><text x="808" y="528" font-size="24" font-weight="700" fill="#e3b341">+14 %</text>
    <polyline points="808,566 820,563 832,560 844,561 856,558 868,556 880,557 892,555 904,554" fill="none" stroke="#d29922" stroke-width="2"/>
  </g>
</svg>
